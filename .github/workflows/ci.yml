name: KlaimKilat AI CI Pipeline

on:
  push:
    branches: ["main", "develop", "feat/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  lint-typecheck-test:
    name: Ruff Lint, Mypy Typecheck, RAG Eval & Pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: uv run ruff check app tests eval

      - name: Run Mypy Type Checker
        run: uv run mypy app tests eval

      - name: Run Hybrid RAG (pgvector + RRF) Evaluation Benchmark
        run: uv run python -m eval.evaluate_rag

      - name: Run Unit & Integration Tests (Pytest)
        run: uv run pytest -v
