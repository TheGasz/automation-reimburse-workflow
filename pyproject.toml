[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "klaimkilat-langgraph-agent"
version = "1.0.0"
description = "KlaimKilat AI — Smart Omnichannel Reimbursement & Audit Agent powered by LangGraph, Hybrid RAG (pgvector + RRF), and DeepSeek"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bagas", email = "bagas@dbklik.co.id" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "langgraph>=0.2.35",
    "langchain-core>=0.3.10",
    "langchain-openai>=0.2.2",
    "langchain-text-splitters>=0.3.0",
    "asyncpg>=0.29.0",
    "redis>=5.1.0",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "pillow>=10.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
